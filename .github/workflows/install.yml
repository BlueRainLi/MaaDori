name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "resource/**"
      - "agent/**"
      - "interface.json"
      - "interface_zh.json"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "resource/**"
      - "agent/**"
      - "interface.json"
      - "interface_zh.json"
      - "**.py"
  workflow_dispatch:
    inputs:
      full_build:
        description: "构建全部 8 个平台组合（默认只构建 win-x86_64）"
        required: false
        type: boolean
        default: false

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT

      - id: set_matrix
        run: |
          # 默认（含 tag 发版）只构建 win-x86_64，节省 Actions 时长与 Artifact Storage；
          # 如需全部 8 个平台组合，请手动触发 workflow_dispatch 并勾选 full_build
          full=${{ github.event_name == 'workflow_dispatch' && inputs.full_build == true }}
          if [[ $full == true ]]; then
            echo 'matrix={"os":["win","macos","linux","android"],"arch":["aarch64","x86_64"]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"os":["win"],"arch":["x86_64"]}' >> $GITHUB_OUTPUT
          fi
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
      matrix: ${{ steps.set_matrix.outputs.matrix }}

  install:
    needs: [meta, changelog]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: true
          out-file-path: "deps"
          extract: true

      - name: Download MFAAvalonia
        if: matrix.os != 'android'
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: SweetSmellFox/MFAAvalonia
          fileName: "MFAAvalonia-*-${{ (matrix.os == 'win' && 'win') || (matrix.os == 'macos' && 'osx') || (matrix.os == 'linux' && 'linux') }}-${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'arm64') }}*"
          latest: true
          out-file-path: "MFA"
          extract: true

      - name: Clean up MFAAvalonia archive
        if: matrix.os != 'android'
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MFAAvalonia."

      - name: Remove built-in runtime in MFA
        if: matrix.os != 'android'
        shell: bash
        run: |
          rm -rf MFA/runtimes

      - name: Install
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" != "android" ]]; then
            if [ -d "MFA" ]; then
              echo "Copying MFA files to install directory..."
              mkdir -p install
              rsync -av --ignore-existing MFA/ install/
              echo "MFA files copied successfully."
            else
              echo "MFA directory not found, skipping copy."
            fi
          else
            echo "Skipping copy MFA for Android."
          fi

          cd tools/
          python -m pip install -r ./requirements.txt
          python ./install.py ${{ needs.meta.outputs.tag }} ${{ matrix.os }} ${{ matrix.arch }}
          cd ..

      # 发版：直接打包并上传 Release，不经过 artifact 中转，
      # 彻底绕开 Actions Artifact Storage 配额限制
      - name: Package release zip
        if: ${{ needs.meta.outputs.is_release == 'true' }}
        run: |
          cd install
          zip -r "../MaaDori-${{ matrix.os }}-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}.zip" .

      - name: Release
        if: ${{ needs.meta.outputs.is_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: "MaaDori-*"
          tag_name: ${{ needs.meta.outputs.tag }}
          # 发布说明末尾固定附加 MaaFW python 绑定升级提示：
          # 包内 MaaFramework 跟随上游最新版（install.yml 用 latest: true 下载），
          # 用户本机的 pip 绑定若是旧版（如 5.12.3），AgentServer 会因版本不配套启动失败
          body: |
            ${{ needs.changelog.outputs.release_body }}

            ---

            ### ⚠️ 使用前必读：更新 MaaFW python 绑定

            本包内置的 MaaFramework 始终跟随上游最新版本。如果你曾安装过旧版本的
            MAA 项目（本机 pip 绑定落后于包内版本），AgentServer 将无法启动
            （表现为任务一直卡住 / agent 进程异常）。请先在终端执行：

            ```
            pip install -U MaaFw
            ```

            升级完成后再运行本包。
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

      # 非发版（日常 CI）：仅上传 artifact 供调试，1 天后自动清理
      - name: Upload debug artifact
        if: ${{ needs.meta.outputs.is_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: MaaDori-${{ matrix.os }}-${{ matrix.arch }}
          path: "install"
          retention-days: 1

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 本项目正式版 tag 一律三段式（如 v0.6.0），pattern 依赖三段式匹配，
          # 不要改回两段式（v0.6），否则匹配不到任何标签，说明会整体落入「未发布」
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
